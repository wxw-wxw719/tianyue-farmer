<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>田约认采 · 认养人工作台</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --cream:#F5F1E8; --cream2:#EFEADA; --card:#FFFFFF; --line:#EAE4D5; --line2:#F0EADA;
  --ink:#28301F; --ink2:#5C6152; --mute:#8E8D7C;
  --green:#22392B; --green2:#2C4A35; --leaf:#4C6B47; --leaf2:#7C9A6E;
  --orange:#C0521E; --orange2:#E3733D; --peach:#FBEEE0; --peach2:#F6E2CC;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--cream); color:var(--ink);
  font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; min-height:100vh;
}
a{text-decoration:none;color:inherit}

/* ---------- 侧栏 ---------- */
.side{
  width:286px;flex:0 0 286px;background:var(--green);color:#fff;
  display:flex;flex-direction:column;padding:22px 16px 16px;position:sticky;top:0;height:100vh;
  background-image:radial-gradient(120% 60% at 0% 8%,rgba(255,255,255,.06),transparent 60%),
                    radial-gradient(80% 40% at 100% 100%,rgba(120,160,110,.10),transparent 70%);
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px}
.brand .logo{width:40px;height:40px;border-radius:11px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.brand .logo svg{width:22px;height:22px}
.brand .nm{font-size:17px;font-weight:700;letter-spacing:.5px;line-height:1.1}
.brand .rl{font-size:10px;color:rgba(255,255,255,.52);letter-spacing:1.4px;margin-top:3px}
.usercard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:13px;margin-bottom:18px}
.av{width:35px;height:35px;border-radius:9px;background:#EDE4CF;color:#7A6A45;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:0 0 35px}
.av.sm{width:26px;height:26px;border-radius:50%;font-size:12px;flex:0 0 26px}
.usercard .u{flex:1;min-width:0}
.usercard .u b{display:block;font-size:13px;font-weight:500;letter-spacing:.3px}
.usercard .u span{display:block;font-size:10.5px;color:rgba(255,255,255,.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bellsm{width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 24px}
.bellsm svg{width:12px;height:12px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:1.5}
.bellsm .dot{position:absolute;top:-4px;right:-5px;min-width:14px;height:14px;border-radius:9px;background:var(--orange2);font-size:9px;line-height:14px;text-align:center;font-weight:700;color:#fff;padding:0 3px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:13px;color:rgba(255,255,255,.74);position:relative;transition:.16s}
.nav a svg{width:16px;height:16px;stroke:rgba(255,255,255,.62);fill:none;stroke-width:1.5;flex:0 0 16px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.11);color:#fff;font-weight:500}
.nav a.on svg{stroke:#fff}
.nav a.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2.5px;border-radius:2px;background:var(--orange2)}
.nav a .cnt{margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.55);font-weight:400}
.navlbl{font-size:10.5px;letter-spacing:1.6px;color:rgba(255,255,255,.34);padding:18px 12px 8px}
.sidefoot{margin-top:auto;padding:14px 10px 2px;border-top:1px solid rgba(255,255,255,.09)}
.sidefoot a{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.66)}
.sidefoot a svg{width:12px;height:12px;stroke:currentColor;fill:none}
.sidefoot p{font-size:9.5px;line-height:1.7;color:rgba(255,255,255,.3);margin:10px 0 0}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;height:66px;padding:0 44px;border-bottom:1px solid rgba(40,48,31,.08);background:rgba(245,241,232,.86);backdrop-filter:blur(6px);position:sticky;top:0;z-index:20}
.crumb{font-size:12.5px;color:var(--mute);letter-spacing:.3px}
.crumb b{color:#3C4632;font-weight:500}
.crumb i{font-style:normal;margin:0 7px;opacity:.5}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px}
.wpill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:11.5px;color:#6B7060;white-space:nowrap}
.wpill b{font-weight:500;color:#3C4632}
.wpill svg{width:13px;height:13px;stroke:#B08242;fill:none;stroke-width:1.4}
.ibtn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.ibtn svg{width:15px;height:15px;stroke:#5C6152;fill:none;stroke-width:1.5}
.ibtn .dot{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:9px;background:var(--orange2);color:#fff;font-size:9px;line-height:15px;text-align:center;font-weight:700;padding:0 3px;border:1.5px solid var(--cream)}
.me{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:12px;color:#3C4632;cursor:pointer}

.wrap{padding:34px 44px 70px;max-width:1360px;width:100%}
.greet{margin-bottom:26px}
.greet .dt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:12px}
.greet .dt svg{width:12px;height:12px;stroke:currentColor;fill:none}
.greet h1{font-size:40px;line-height:1.24;margin:0 0 10px;font-weight:600;letter-spacing:.5px;color:#2B3323;font-family:'Noto Serif SC',Georgia,serif}
.greet h1 em{font-style:normal;color:var(--orange)}
.greet p{margin:0;font-size:13.5px;color:#7E8272;line-height:1.9}

.stats{display:grid;grid-template-columns:1.15fr .95fr 1fr;gap:16px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px 18px;position:relative;transition:.2s}
.stat:hover{box-shadow:0 8px 24px rgba(40,48,31,.06);transform:translateY(-1px)}
.stat .ico{position:absolute;top:18px;right:18px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.stat .ico svg{width:17px;height:17px;stroke:#B9744A;fill:none;stroke-width:1.4}
.stat .k{font-size:12px;color:#7E8272;letter-spacing:.4px}
.stat .num{font-size:38px;font-weight:600;line-height:1.2;margin:10px 0 6px;font-family:'Noto Serif SC',Georgia,serif;letter-spacing:-.5px}
.stat .num small{font-size:14px;font-weight:400;margin-left:4px;color:#6B7060}
.stat .note{font-size:11px;color:var(--mute);display:flex;align-items:center;gap:5px}
.stat.warm{background:var(--peach);border-color:var(--peach2)}
.stat.warm .num{color:#4A3A28}

.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.18s}
.act:hover{border-color:#D8CFB6;transform:translateY(-1px);box-shadow:0 6px 18px rgba(40,48,31,.05)}
.act .tile{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;background:var(--cream2)}
.act .tile svg{width:17px;height:17px;stroke:#6B6248;fill:none;stroke-width:1.5}
.act .tile.orange{background:var(--peach)}
.act .tile.orange svg{stroke:var(--orange)}
.act .tile.green{background:#E8EFE3}
.act .tile.green svg{stroke:var(--leaf)}
.act .tile.blue{background:#E9EEF2}
.act .tile.blue svg{stroke:#5C7E96}
.act b{display:block;font-size:13.5px;font-weight:500;color:#333B2B}
.act span{display:block;font-size:11px;color:var(--mute);margin-top:3px}

.hero-grid{display:grid;grid-template-columns:1.72fr .98fr;gap:18px;margin-bottom:18px}
.feature{position:relative;border-radius:20px;overflow:hidden;min-height:400px;display:flex;align-items:flex-end;color:#fff}
.feature>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,14,.10) 0%,rgba(12,20,14,.22) 42%,rgba(12,20,14,.80) 100%)}
.feature .in{position:relative;z-index:2;padding:26px 30px;width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(20,30,20,.48);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-size:11px;color:#F3EFE2}
.chip svg{width:12px;height:12px;stroke:#DCE6C8;fill:none}
.feature .corner{position:absolute;top:22px;left:26px;z-index:2}
.feature .corner2{position:absolute;top:24px;right:26px;z-index:2;font-size:10.5px;color:rgba(255,255,255,.62)}
.feature h2{font-size:36px;line-height:1.36;margin:44px 0 10px;font-weight:600;letter-spacing:.5px;font-family:'Noto Serif SC',Georgia,serif;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.feature p{font-size:12px;color:rgba(255,255,255,.72);margin:0 0 18px;letter-spacing:.2px}
.fbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#2B3323;border-radius:999px;padding:10px 18px;font-size:12.5px;font-weight:500;cursor:pointer;border:none;font-family:inherit}
.fbtn:hover{background:#F7F2E4}
.fbtn svg{width:13px;height:13px;stroke:#2B3323;fill:none;stroke-width:1.6}
.mates{position:absolute;right:26px;bottom:26px;z-index:2;display:flex;align-items:center;gap:9px;font-size:11px;color:rgba(255,255,255,.8)}
.mates img{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.85);object-fit:cover}
.mates b{display:block;font-size:11px;color:#fff;font-weight:500}
.mates span{display:block;font-size:10px;color:rgba(255,255,255,.62)}

.aside-card{position:relative;border-radius:20px;overflow:hidden;display:flex;align-items:flex-end;min-height:400px}
.aside-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aside-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,14,.18) 0%,rgba(12,20,14,.30) 40%,rgba(12,20,14,.85) 100%)}
.aside-card .in{position:relative;z-index:2;padding:22px;width:100%;color:#fff}
.aside-card .live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 10px;font-size:10px}
.aside-card .live em{width:5px;height:5px;border-radius:50%;background:#FF7A45;font-style:normal}
.aside-card h3{font-size:23px;margin:78px 0 6px;font-weight:600;font-family:'Noto Serif SC',Georgia,serif;line-height:1.4}
.aside-card p{font-size:11px;color:rgba(255,255,255,.7);margin:0}
.aside-card .row{display:flex;align-items:center;justify-content:space-between;margin-top:16px}

.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel .ph h3{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px;color:#333B2B}
.panel .ph span{font-size:11.5px;color:var(--mute);cursor:pointer}
.panel .ph span:hover{color:var(--orange)}
.kv{display:flex;gap:14px;flex-wrap:wrap}
.kv .item{flex:1;min-width:104px;background:var(--cream);border-radius:12px;padding:12px 14px}
.kv .item i{font-style:normal;font-size:10.5px;color:var(--mute);display:block;margin-bottom:6px}
.kv .item b{font-size:16px;font-weight:600;font-family:'Noto Serif SC',Georgia,serif}
.kv .item b small{font-size:10.5px;font-weight:400;margin-left:2px;color:#7E8272}

.tl{display:flex;align-items:flex-start;gap:0;margin-top:6px}
.tl .n{flex:1;position:relative;text-align:center}
.tl .n::before{content:'';position:absolute;top:9px;left:50%;width:100%;height:1px;background:var(--line);z-index:1}
.tl .n:last-child::before{display:none}
.tl .dot{width:19px;height:19px;border-radius:50%;border:1.5px solid #D6D0BC;background:#fff;margin:0 auto 9px;position:relative;z-index:2;display:flex;align-items:center;justify-content:center}
.tl .dot svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:2.4;display:none}
.tl .n.done .dot{background:var(--leaf);border-color:var(--leaf)}
.tl .n.done .dot svg{display:block}
.tl .n.now .dot{background:#fff;border-color:var(--orange);border-width:2.5px;box-shadow:0 0 0 4px rgba(192,82,30,.12)}
.tl .n b{display:block;font-size:12px;font-weight:500;color:#3C4632}
.tl .n em{display:block;font-style:normal;font-size:10.5px;color:var(--mute);margin-top:3px}
.tl .n.now em{color:var(--orange);font-weight:500}

.media{display:flex;gap:14px;align-items:center;background:var(--cream);border-radius:13px;padding:10px;margin-bottom:12px}
.media img{width:96px;height:66px;border-radius:9px;object-fit:cover;flex:0 0 96px}
.media .c b{display:block;font-size:12.5px;font-weight:500;margin-bottom:4px}
.media .c span{font-size:11px;color:var(--mute);line-height:1.6}
.media .play{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 30px;cursor:pointer}
.media .play svg{width:11px;height:11px;fill:#6B6248;stroke:none;margin-left:1px}

.task{display:flex;align-items:center;gap:12px;border:1px dashed #DED6C0;border-radius:13px;padding:12px 14px;background:#FDFCF7}
.task .tic{width:30px;height:30px;border-radius:9px;background:#F3EFE1;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.task .tic svg{width:14px;height:14px;stroke:#8C7A4E;fill:none}
.task b{display:block;font-size:12px}
.task span{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}
.task button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;color:#4A5340}
.task button:hover{border-color:var(--orange);color:var(--orange)}

.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.post .ph2{position:relative;height:150px}
.post .ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.post .tag{position:absolute;left:10px;top:10px;background:rgba(20,26,18,.55);color:#fff;font-size:10px;padding:4px 8px;border-radius:6px;backdrop-filter:blur(4px)}
.post .dur{position:absolute;right:10px;top:10px;color:#fff;font-size:10px;background:rgba(20,26,18,.55);padding:3px 7px;border-radius:5px}
.post .bd{padding:14px 16px 16px}
.post .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post .who img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.post .who b{font-size:11.5px;font-weight:500}
.post .who span{font-size:10px;color:var(--mute)}
.post p{margin:0;font-size:11.5px;line-height:1.85;color:#5C6152}
.post .act2{display:flex;gap:14px;margin-top:12px;font-size:10.5px;color:var(--mute)}
.post .act2 span{cursor:pointer}
.post .act2 span:hover{color:var(--orange)}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:10px 18px;font-size:12.5px;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:#3C4632}
.btn:hover{border-color:#D8CFB6}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.primary:hover{background:#2C4A35}
.btn.orange{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.orange:hover{background:#D0611F}
.btn.sm{padding:7px 13px;font-size:11.5px}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:4px 9px;border-radius:999px;background:#F1EFE3;color:#6B7060;cursor:pointer}
.badge.green{background:#E8EFE3;color:#4C6B47}
.badge.orange{background:var(--peach);color:#B26B3E}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:500;color:#7E8272;font-size:11.5px;padding:10px 12px;border-bottom:1px solid var(--line);background:#FBF9F2}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);color:#454E3C;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tree{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s;cursor:pointer}
.tree:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(40,48,31,.07);border-color:#DBD2B9}
.tree .im{height:132px;position:relative}
.tree .im img{width:100%;height:100%;object-fit:cover;display:block}
.tree .im .tagx{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 9px;font-size:10px;color:#4C6B47;font-weight:500}
.tree .bd{padding:14px 16px 16px}
.tree .bd h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
.tree .meta{font-size:11px;color:var(--mute);line-height:1.9}
.tree .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.tree .price{font-size:17px;font-weight:600;font-family:'Noto Serif SC',Georgia,serif;color:#33291F}
.tree .price small{font-size:10.5px;font-weight:400;color:var(--mute)}

.field{margin-bottom:20px}
.field label{display:block;font-size:12.5px;color:#4A5340;margin-bottom:8px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:#C7BF9F;box-shadow:0 0 0 3px rgba(192,82,30,.07)}
.plaque{border-radius:12px;padding:16px;text-align:center;background:linear-gradient(160deg,#F7EBD8,#EEDFC5);border:1px solid #E3D3B4;font-family:'Noto Serif SC',Georgia,serif;font-size:16px;color:#6B4A26;letter-spacing:2px}
.plaque small{display:block;font-size:10px;color:#A5906E;margin-top:8px;font-family:'Noto Sans SC',sans-serif;letter-spacing:2px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;background:#fff;transition:.16s}
.opt:hover{border-color:#D8CFB6}
.opt.on{border-color:var(--orange);background:#FDF6EE;box-shadow:0 0 0 2px rgba(192,82,30,.08)}
.opt b{display:block;font-size:12.5px;margin-bottom:4px}
.opt span{display:block;font-size:10.5px;color:var(--mute);line-height:1.7}
.sumbox{background:var(--cream);border-radius:13px;padding:16px;font-size:12.5px;color:#4A5340}
.sumbox div{display:flex;justify-content:space-between;padding:5px 0}
.sumbox .total{border-top:1px dashed #D9D2BC;margin-top:8px;padding-top:10px;font-weight:600;font-size:15px;color:#33291F}
.check{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#5C6152;cursor:pointer}
.check input{width:15px;height:15px;accent-color:var(--orange)}

.chatbox{display:flex;flex-direction:column;height:470px}
.chatlog{flex:1;overflow:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:64%;font-size:12.5px;line-height:1.8;padding:10px 13px;border-radius:14px}

.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.quick span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11px;color:#5C6152;cursor:pointer;background:#fff}
.quick span:hover{border-color:var(--orange);color:var(--orange)}
.chatinput{display:flex;gap:10px}
.chatinput input{flex:1}

.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(34,57,43,.94);color:#fff;font-size:12px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.28s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.footer-note{font-size:11px;color:#A3A292;margin-top:30px;text-align:center;line-height:1.9}

/* ---------- 8号树情感陪伴入口 ---------- */
.tree-entry{
  position:relative;display:flex;align-items:center;gap:18px;margin:0 0 18px;padding:18px 22px;
  border-radius:20px;overflow:hidden;cursor:pointer;isolation:isolate;
  background:linear-gradient(112deg,#20382A 0%,#2D4B35 58%,#5A7450 100%);
  color:#fff;box-shadow:0 20px 42px -34px rgba(34,57,43,.8);
  transition:transform .2s ease,box-shadow .2s ease;
}
.tree-entry:hover{transform:translateY(-2px);box-shadow:0 24px 48px -32px rgba(34,57,43,.72)}
.tree-entry:focus-visible{outline:2px solid #F0C59E;outline-offset:3px}
.tree-entry::before{
  content:'';position:absolute;right:-35px;top:-105px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,202,136,.2),rgba(255,202,136,0) 68%);z-index:-1;
}
.tree-entry::after{
  content:'';position:absolute;right:35px;bottom:-110px;width:230px;height:230px;border-radius:50%;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 24px rgba(255,255,255,.025),0 0 0 48px rgba(255,255,255,.015);z-index:-1;
}
.te-art{
  width:78px;height:78px;flex:0 0 78px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
}
.te-art svg{width:61px;height:61px}
.te-copy{min-width:0;flex:1}
.te-kicker{display:block;margin-bottom:2px;color:#F0C59E;font-size:9.5px;font-weight:500;letter-spacing:1.5px}
.te-copy b{display:block;color:#fff;font-family:'Noto Serif SC',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.5px;line-height:1.35}
.te-copy p{margin:4px 0 0;color:rgba(255,255,255,.62);font-size:11.5px;line-height:1.65}
.te-btn{
  display:inline-flex;flex:0 0 auto;align-items:center;gap:6px;padding:9px 14px;border:1px solid rgba(255,255,255,.2);
  border-radius:999px;background:rgba(255,255,255,.09);color:#fff;font-size:11.5px;white-space:nowrap;transition:.18s;
}
.te-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.tree-entry:hover .te-btn{background:#fff;border-color:#fff;color:#22392B}

/* ---------- 嵌入认养人端 ---------- */
.companion-layer{
  position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;background:var(--cream);
  opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .24s ease,transform .28s ease,visibility .28s;
}
.companion-layer.open{opacity:1;visibility:visible;transform:none}
.companion-bar{
  display:flex;height:58px;flex:0 0 58px;align-items:center;justify-content:space-between;gap:18px;

.cb-left{display:flex;min-width:0;align-items:center;gap:12px}
.cb-mark{display:grid;width:31px;height:31px;flex:0 0 31px;place-items:center;border-radius:10px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13)}
.cb-mark svg{width:19px;height:19px}
.cb-copy{min-width:0}
.cb-kicker{display:block;color:#E8BA91;font-size:8.5px;letter-spacing:1.2px;line-height:1.2}
.cb-title{display:block;margin-top:2px;color:#fff;font-family:'Noto Serif SC',Georgia,serif;font-size:15px;font-weight:600;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-actions{display:flex;flex:0 0 auto;align-items:center;gap:12px}
.cb-open{color:rgba(255,255,255,.6);font-size:10.5px;transition:color .16s}

.cb-close{

.cb-close:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35)}
.companion-layer iframe{display:block;width:100%;flex:1;border:0;background:var(--cream)}

/* ---------- 双端外壳 ---------- */
function buildNav(side){
  return NAV[side].map(g=>
    (g.lbl? `<div class="navlbl">${g.lbl}</div>`:'') +
    g.items.map(it=>`<a href="#${it.r}" data-r="${it.r}"${it.r==='companion'?' onclick="event.preventDefault();openCompanion()"':''}>${I[it.ic]}${it.t}${it.cnt?`<span class="cnt">${it.cnt}</span>`:''}</a>`).join('')
  ).join('');
}
function refreshNav(active){
  [...document.querySelectorAll('#nav a')].forEach(a=>a.classList.toggle('on', a.dataset.r===active));
}
function paintChrome(){
  const f = state.side === 'farmer';
  document.body.classList.toggle('farmer', f);
  const brand = document.getElementById('brandRole');
  if(brand) brand.textContent = f ? '农户工作台' : '认养人工作台';
  const av = document.getElementById('userAv');
  if(av){
    if(f){ av.textContent=''; av.style.backgroundImage=`url("${IMG.keeper}")`; av.style.backgroundSize='cover'; av.style.backgroundPosition='center 20%'; }
    else { av.textContent='晓'; av.style.backgroundImage='none'; }
  }
  const nm = document.getElementById('userName');
  if(nm) nm.textContent = f ? '周桂芳' : '母晓龙';
  const sub = document.getElementById('userSub');
  if(sub) sub.textContent = f ? '团结村 3 号果园 · 代管 8 棵' : '锦江学院 · 8 号树认养人';
  const cs = document.getElementById('crumbSide');
  if(cs) cs.textContent = f ? '农户端' : '客户端';
  const ma = document.getElementById('meAv'), mn = document.getElementById('meName');
  if(ma){ ma.textContent = f?'芳':'晓'; }
  if(mn) mn.textContent = f ? '周桂芳' : '母晓龙';
  const st = document.getElementById('switchTxt');
  if(st) st.textContent = f ? '切回用户端' : '切回农户端';
  const nav = document.getElementById('nav');
  if(nav) nav.innerHTML = buildNav(state.side);
}
function setSide(side, route){
  state.side = side;
  try{ localStorage.setItem('ty_side', side); }catch(e){}
  paintChrome();
  const target = route || (side==='farmer' ? 'fhome' : 'home');
  if(location.hash !== '#'+target){ location.hash = target; }
  render();
}

/* ---------- 路由 ---------- */
function render(){
  const h = (location.hash||'').replace('#','');
  const parts = h.split('/');
  const r = parts[0], arg = parts[1];
  if(r === 'farm'){ setSide('farmer','fhome'); return; }
  const pages = {home:pageHome,mine:pageMine,trees:pageTrees,feed:pageFeed,chat:pageChat,
                 harvest:pageHarvest,progress:pageProgress,group:pageGroup,charity:pageCharity,
                 me:pageMe,success:pageSuccess,
                 orders:pageOrders,wallet:pageWallet,live:pageLive,
                 fhome:pageFHome,ffeed:pageFFeed,forders:pageFOrders,fmine:pageFMine,
                 fwallet:pageFWallet,flive:pageFLive,fme:pageFMe,
                 checkout:()=>pageCheckout(arg||'t8'), tree:()=>pageTree(arg||'t8')};
  const FROUTES = ['fhome','ffeed','forders','fmine','fwallet','flive','fme'];
  if(pages[r]){
    const want = FROUTES.indexOf(r)>-1 ? 'farmer' : 'client';
    if(state.side !== want){
      state.side = want;
      try{ localStorage.setItem('ty_side', want); }catch(e){}
      paintChrome();
    }
  }
  const def = state.side==='farmer' ? 'fhome' : 'home';
  const rk = pages[r] ? r : def;
  document.getElementById('view').innerHTML = pages[rk]();
  document.getElementById('crumbName').textContent = ROUTE_NAME[rk]||'工作台';
  const alias = (rk==='tree')?'trees':(rk==='progress'?'harvest':(rk==='success'?'trees':''));
  refreshNav(alias || rk);
  window.scrollTo(0,0);
}
function go(r,arg){
  if(r==='liveToggle'){ toggleLive(); r='flive'; }
  location.hash = arg? (r+'/'+arg) : r;
}

/* ---------- 交互 ---------- */

function postFeed(){
  const i = document.getElementById('fpost');
  const v = ((i&&i.value)||'').trim();
  if(!v){ toast('先写一句，再发布'); return; }
  farm.posts.unshift({id:'p'+Date.now(), txt:v, ts:'刚刚 · 11/21', likes:0});
  saveFarm();
  if(i) i.value='';
  render();
  toast('已发布，客户端「田埂动态」同步可见');
}
function delPost(id){
  farm.posts = farm.posts.filter(p=>p.id!==id);
  saveFarm(); render(); toast('已删除这条动态');
}
function toggleLive(){
  farm.living = !farm.living;
  farm.liveStart = farm.living ? Date.now() : null;
  saveFarm();
  if(farm.living) toast('直播已开始，214 位预约人收到开播提醒');
  else toast('直播已结束，回放保留 30 天');
  render();
}
function pickOrder(id){
  if(farm.picked.indexOf(id)>-1) return;
  farm.picked.push(id); saveFarm(); render();
  toast('已标记采摘，客户端的收成进度同步更新');
}
function withdraw(){
  if(farm.balance<=0){ toast('本月已经提现过了'); return; }
  farm.logs.push({ts:'11/21', t:'提现到农业银行（尾号 6621）', amt:farm.balance});
  farm.balance = 0;
  saveFarm(); render();
  toast('提现已申请，2 小时内到账');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('on'),1900);
}
function pickPlan(p){ state.plan=p; render(); }
function pickWay(w){ state.ways=w; render(); }
function pickHarvest(k){

    const oc=x.getAttribute('onclick')||'';
    if(oc.indexOf('pickHarvest')>-1) x.classList.toggle('on', oc.indexOf("'"+k+"'")>-1);

function plaquePreview(v){

function sendQuick(t){
  const log=document.getElementById('log'); if(!log) return;
  log.insertAdjacentHTML('beforeend','<div class="msg mine">'+t+'<time>刚刚</time></div>');
  log.scrollTop=log.scrollHeight;
  setTimeout(()=>{
    log.insertAdjacentHTML('beforeend','<div class="msg them">收到娃儿，阿姨记下了。<time>刚刚</time></div>');
    log.scrollTop=log.scrollHeight;
  },1600);
}
function sendMsg(){
  const i=document.getElementById('chatIn'); if(!i) return;
  const v=(i.value||'').trim();
  if(!v){ toast('说点什么再发送'); return; }
  const log=document.getElementById('log');
  log.insertAdjacentHTML('beforeend','<div class="msg mine">'+v+'<time>刚刚</time></div>');
  i.value=''; log.scrollTop=log.scrollHeight;
  setTimeout(()=>{
    log.insertAdjacentHTML('beforeend','<div class="msg them">嗯，你说的我晓得了，我记到本本上。<time>刚刚</time></div>');
    log.scrollTop=log.scrollHeight;
  },1600);
}

/* ---------- 在客户端内嵌入认养人端 ---------- */
let companionLastFocus = null;
function openCompanion(){
  const layer = document.getElementById('companionLayer');
  const frame = document.getElementById('companionFrame');
  if(!layer || !frame) return;
  if(!frame.dataset.loaded){
    frame.src = 'client.html?embed=1';
    frame.dataset.loaded = '1';
  }
  companionLastFocus = document.activeElement;
  layer.classList.add('open');
  layer.setAttribute('aria-hidden','false');
  document.body.classList.add('companion-open');
  const close = layer.querySelector('.cb-close');
  if(close) close.focus({preventScroll:true});
}
function closeCompanion(){
  const layer = document.getElementById('companionLayer');
  if(!layer) return;
  layer.classList.remove('open');
  layer.setAttribute('aria-hidden','true');
  document.body.classList.remove('companion-open');
  if(companionLastFocus && typeof companionLastFocus.focus === 'function'){
    companionLastFocus.focus({preventScroll:true});
  }
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    const layer = document.getElementById('companionLayer');
    if(layer && layer.classList.contains('open')) closeCompanion();
  }
});

window.addEventListener('hashchange',render);
document.getElementById('toFarm').addEventListener('click',e=>{
  e.preventDefault();
  setSide(state.side==='farmer'?'client':'farmer');
});
try{ state.side = localStorage.getItem('ty_side') || 'client'; }catch(e){}
paintChrome();
render();
</script>

<!-- ===== 去除平台自动注入的“豆包/AI生成”角标 ===== -->
<style id="no-doubao-badge">
  [data-custom-element="doubao-watermark"],
  [data-custom-element="doubao-watermark-mobile"]{
    display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important;
  }
</style>
<script>
(function(){
  function strip(root){
    try{
      var list=(root.querySelectorAll?root.querySelectorAll('[data-custom-element]'):[]);
      for(var i=0;i<list.length;i++){
        var v=list[i].getAttribute('data-custom-element')||'';
        if(v.indexOf('watermark')>-1){ list[i].remove(); }
      }
    }catch(e){}
  }
  strip(document);
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType===1){
          var v=n.getAttribute&&n.getAttribute('data-custom-element');
          if(v&&v.indexOf('watermark')>-1){ n.remove(); return; }
          strip(n);
        }
      });
    });
  });
  mo.observe(document.documentElement,{childList:true,subtree:true});
  var n=0,t=setInterval(function(){ strip(document); if(++n>50) clearInterval(t); },200);
})();
</script>
